# ============================================================
# Fabrique du livre : deux PDF et un EPUB, à chaque push.
#
# Ce fichier est le MÊME dans les trois dépôts de l'organisation
# (organisations-toxiques, envers-du-decor, un-produit-sans-dev) :
# seule la valeur de SLUG ci-dessous en distingue les copies.
# Une correction ici se reporte telle quelle dans les deux autres.
# ============================================================
name: Build PDF and EPUB

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

# Un seul build par branche : un push qui en suit un autre de près annule
# le précédent, au lieu de doubler minutes et stockage pour rien.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SLUG: envers_du_decor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PDF (édition A5)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Build PDF (édition poche 108x175 mm)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_poche.tex

      # ------------------------------------------------------------
      # Chaîne EPUB : réservée à main et au déclenchement manuel. Sur
      # les branches de travail, l'installation de pandoc et d'epubcheck
      # coûtait plus de temps que tout le reste du build réuni.
      # Pour vérifier l'EPUB depuis une branche : onglet Actions →
      # « Build PDF and EPUB » → « Run workflow ».
      # ------------------------------------------------------------
      - name: Install pandoc, imagemagick, poppler and epubcheck
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y pandoc imagemagick poppler-utils epubcheck default-jre-headless

      - name: Build EPUB
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: bash scripts/build_epub.sh "$SLUG.epub"

      - name: Validate EPUB (epubcheck)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: java -jar /usr/share/java/epubcheck.jar "$SLUG.epub"

      - name: Rename deliverables
        run: |
          mv main.pdf "${SLUG}_a5.pdf"
          mv main_poche.pdf "${SLUG}_poche.pdf"

      # Branches de travail : les deux PDF seulement.
      - name: Upload build artifacts (PDF only)
        if: github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}
          path: |
            ${{ env.SLUG }}_a5.pdf
            ${{ env.SLUG }}_poche.pdf
          if-no-files-found: error
          retention-days: 14

      # main et déclenchement manuel : tous les livrables.
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}
          path: |
            ${{ env.SLUG }}_a5.pdf
            ${{ env.SLUG }}_poche.pdf
            ${{ env.SLUG }}.epub
            dist/cover_kindle_1600x2560.jpg
          if-no-files-found: error
          retention-days: 14

      # Release depuis main seulement — les branches de travail se
      # contentent de construire et de déposer leurs artefacts.
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-${{ github.run_id }}
          name: Release ${{ github.ref_name }}-${{ github.run_id }}
          draft: false
          prerelease: false
          files: |
            ${{ env.SLUG }}_a5.pdf
            ${{ env.SLUG }}_poche.pdf
            ${{ env.SLUG }}.epub
            dist/cover_kindle_1600x2560.jpg
