name: Build PDF and EPUB

on:
  push:
    branches:
      - main # assuming your default branch is 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Build PDF
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main.tex

      - name: Add timestamp to PDF filename
        run: mv main.pdf "ebook_entreprise_liberee_l_envers_du_decor-$(date +%Y%m%d%H%M%S).pdf"

      - name: Upload PDF
        uses: actions/upload-artifact@v2
        with:
          name: Behind_the_scenes_of_Liberated_Companies
          path: "ebook_entreprise_liberee_l_envers_du_decor-*.pdf"
          if-no-files-found: error
          archive_format: none

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert LaTeX to EPUB
        run: |
          pandoc main.tex --epub-cover-image=images/cover.png -o  ebook_entreprise_liberee_l_envers_du_decor.epub

      - name: Generate tag and release names
        id: generate_names
        run: |
          echo "::set-output name=tag_name::${{ github.ref_name }}-$(date +%s)"
          echo "::set-output name=release_name::Release ${{ github.ref_name }}-$(date +%s)"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_PRIVATE_TOKEN_FOR_BEHIND_THE_SCENES_EBOOK }}
        with:
          tag_name: ${{ steps.generate_names.outputs.tag_name }}
          release_name: ${{ steps.generate_names.outputs.release_name }}
          draft: false
          prerelease: false
      
      - name: Upload EPUB Release Asset
        id: upload-release-asset-epub
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_PRIVATE_TOKEN_FOR_BEHIND_THE_SCENES_EBOOK }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./ebook_entreprise_liberee_l_envers_du_decor.epub
          asset_name: ebook_entreprise_liberee_l_envers_du_decor.epub
          asset_content_type: application/epub+zip

      - name: Rename PDF
        run: mv ebook_entreprise_liberee_l_envers_du_decor-*.pdf ebook_entreprise_liberee_l_envers_du_decor.pdf

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_PRIVATE_TOKEN_FOR_BEHIND_THE_SCENES_EBOOK }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./ebook_entreprise_liberee_l_envers_du_decor.pdf
          asset_name: ebook_entreprise_liberee_l_envers_du_decor.pdf
          asset_content_type: application/pdf