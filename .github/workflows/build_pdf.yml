name: Build PDF and EPUB

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PDF (édition A5)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Build PDF (édition poche 108x175 mm)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_poche.tex

      - name: Rename PDFs
        run: |
          mv main.pdf ebook_entreprise_liberee_l_envers_du_decor_a5.pdf
          mv main_poche.pdf ebook_entreprise_liberee_l_envers_du_decor_poche.pdf

      - name: Install pandoc, imagemagick and epubcheck
        run: sudo apt-get update && sudo apt-get install -y pandoc imagemagick epubcheck default-jre-headless

      # EPUB « store » : métadonnées et CSS dans epub/, couvertures TikZ
      # exclues, images JPEG allégées (le script modifie le checkout, jetable en CI)
      - name: Build EPUB
        run: bash scripts/build_epub.sh ebook_entreprise_liberee_l_envers_du_decor.epub

      - name: Validate EPUB (epubcheck)
        run: java -jar /usr/share/java/epubcheck.jar ebook_entreprise_liberee_l_envers_du_decor.epub

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Behind_the_scenes_of_Liberated_Companies
          path: |
            ebook_entreprise_liberee_l_envers_du_decor_a5.pdf
            ebook_entreprise_liberee_l_envers_du_decor_poche.pdf
            ebook_entreprise_liberee_l_envers_du_decor.epub
          if-no-files-found: error

      # Release only from main — work branches just build and upload artifacts
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-${{ github.run_id }}
          name: Release ${{ github.ref_name }}-${{ github.run_id }}
          draft: false
          prerelease: false
          files: |
            ebook_entreprise_liberee_l_envers_du_decor_a5.pdf
            ebook_entreprise_liberee_l_envers_du_decor_poche.pdf
            ebook_entreprise_liberee_l_envers_du_decor.epub
