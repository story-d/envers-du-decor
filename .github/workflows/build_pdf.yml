name: Build PDF and EPUB

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Rename PDF
        run: mv main.pdf ebook_entreprise_liberee_l_envers_du_decor.pdf

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert LaTeX to EPUB
        run: |
          pandoc main.tex --epub-cover-image=images/cover.png -o ebook_entreprise_liberee_l_envers_du_decor.epub

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Behind_the_scenes_of_Liberated_Companies
          path: |
            ebook_entreprise_liberee_l_envers_du_decor.pdf
            ebook_entreprise_liberee_l_envers_du_decor.epub
          if-no-files-found: error

      # Release only from main — work branches just build and upload artifacts
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-${{ github.run_id }}
          name: Release ${{ github.ref_name }}-${{ github.run_id }}
          draft: false
          prerelease: false
          files: |
            ebook_entreprise_liberee_l_envers_du_decor.pdf
            ebook_entreprise_liberee_l_envers_du_decor.epub
